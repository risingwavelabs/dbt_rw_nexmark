name: CI - dbt RisingWave Nexmark

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-dbt-nexmark:
    runs-on: ubuntu-latest
    
    services:
      risingwave:
        image: ghcr.io/risingwavelabs/risingwave:latest
        ports:
          - 4566:4566
        options: >-
          --add-host=host.docker.internal:host-gateway

    env:
      JS_UDF_HTTP_BASE_URL: http://host.docker.internal:18080
      PY_UDF_SERVER_URL: http://host.docker.internal:8815

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dbt-risingwave
        run: |
          pip install --upgrade pip
          pip install dbt-risingwave
          pip install -r scripts/python_udf_server_requirements.txt

      - name: Create dbt profiles directory
        run: mkdir -p ~/.dbt

      - name: Configure dbt profile
        run: |
          cat > ~/.dbt/profiles.yml << EOF
          dbt_rw_nexmark:
            target: dev
            outputs:
              dev:
                type: risingwave
                host: 127.0.0.1
                port: 4566
                user: root
                password: ''
                database: dev
                schema: public
          EOF

      - name: Wait for RisingWave to be ready
        run: |
          timeout 60 bash -c 'until nc -z 127.0.0.1 4566; do sleep 1; done'

      - name: Start UDF mock servers
        run: |
          python scripts/js_udf_http_server.py > /tmp/js_udf_http_server.log 2>&1 &
          python scripts/python_udf_server.py > /tmp/python_udf_server.log 2>&1 &
          timeout 30 bash -c 'until nc -z 127.0.0.1 18080; do sleep 1; done'
          timeout 30 bash -c 'until nc -z 127.0.0.1 8815; do sleep 1; done'

      - name: Test dbt connection
        run: dbt debug

      - name: Install dbt dependencies
        run: dbt deps

      - name: Run dbt seed
        run: dbt seed

      - name: Build all dbt resources
        run: dbt build

      - name: Run dbt tests
        run: dbt test
        continue-on-error: true

      - name: Generate dbt docs
        run: dbt docs generate

      - name: Run wide table example
        run: dbt run --select tag:wide_table_example

      - name: Run zero downtime example
        run: "dbt run --select +tag:zero_downtime_example --vars 'zero_downtime: true'"

      - name: Run incremental models
        run: dbt run --select config.materialized:incremental

      - name: Test specific queries
        run: |
          dbt run --select q1 q2 q3
          dbt test --select q1 q2 q3
        continue-on-error: true

      - name: Full refresh test
        run: dbt run --full-refresh --select tag:wide_table_example
        continue-on-error: true
