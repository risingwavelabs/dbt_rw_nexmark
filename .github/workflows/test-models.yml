name: Test Models

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-models:
    runs-on: ubuntu-latest
    
    services:
      risingwave:
        image: ghcr.io/risingwavelabs/risingwave:latest
        ports:
          - 4566:4566
        options: >-
          --add-host=host.docker.internal:host-gateway

    env:
      JS_UDF_HTTP_BASE_URL: http://host.docker.internal:18080
      PY_UDF_SERVER_URL: http://host.docker.internal:8815

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install dbt-risingwave
          pip install -r scripts/python_udf_server_requirements.txt
          mkdir -p ~/.dbt

      - name: Setup dbt profile
        run: |
          cat > ~/.dbt/profiles.yml << EOF
          dbt_rw_nexmark:
            target: dev
            outputs:
              dev:
                type: risingwave
                host: 127.0.0.1
                port: 4566
                user: root
                password: ''
                database: dev
                schema: public
          EOF

      - name: Wait for RisingWave
        run: sleep 30

      - name: Start UDF mock servers
        run: |
          python scripts/js_udf_http_server.py > /tmp/js_udf_http_server.log 2>&1 &
          python scripts/python_udf_server.py > /tmp/python_udf_server.log 2>&1 &
          timeout 30 bash -c 'until nc -z 127.0.0.1 18080; do sleep 1; done'
          timeout 30 bash -c 'until nc -z 127.0.0.1 8815; do sleep 1; done'

      - name: Run models
        run: |
          dbt deps
          dbt seed
          dbt build
